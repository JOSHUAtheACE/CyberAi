services:
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinel-ai:latest
    container_name: sentinel-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SENTINEL_DATA_DIR: /data
      SENTINEL_MODEL_DIR: /models
      SENTINEL_ALLOWED_ORIGINS: ${SENTINEL_ALLOWED_ORIGINS:-http://localhost:8000}
      SENTINEL_COOKIE_SECURE: ${SENTINEL_COOKIE_SECURE:-false}
    volumes:
      - sentinel-data:/data
      - sentinel-models:/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  sentinel-data:
  sentinel-models:
